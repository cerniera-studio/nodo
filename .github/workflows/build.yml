name: Build APK

on:
  push:
  workflow_dispatch:
    inputs:
      fold_widgets:
        description: Fold Widgets release to test beside (a build-N tag); the latest by default
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          # Compiler and Gradle errors as annotations, readable without the full log
          grep -E "^e: |What went wrong|^> [^T]|Could not|rror:" build.log | grep -v "^> Task" | head -15 | while IFS= read -r line; do echo "::error::${line}"; done
          exit $status

      - name: Test the date reader
        run: gradle :app:testDebugUnitTest --no-daemon -q

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Nodo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Nodo
          path: Nodo.apk

      # Builds on main are releases; other branches publish a pre-release, to try before merging
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Nodo build ${{ github.run_number }}${{ github.ref != 'refs/heads/main' && format(' ({0})', github.ref_name) || '' }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: Nodo.apk

  # Installs on a clean emulator, walks through every screen, and fails the run if the app crashed.
  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Nodo

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: FW_TAG='${{ github.event.inputs.fold_widgets }}' bash tools/emulator_test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator
          path: |
            shot-*.png
            shapes.txt
            walk.txt
            app-log.txt

      - name: Attach screenshots to the release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: |
            shot-*.png
            shapes.txt
            walk.txt
            app-log.txt
